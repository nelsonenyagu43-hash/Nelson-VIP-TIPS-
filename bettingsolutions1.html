<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Betting Solutions · Admin</title>
  <style>
    :root {
      --bg: #0e131b;
      --header: #141b24;
      --surface: #161e29;
      --surface-2: #1c2634;
      --text: #ffffff;
      --muted: #b8c2cc;
      --orange-1: #ff9800;
      --orange-2: #ef6c00;
      --teal-1: #1f7a6b;
      --teal-2: #155b50;
      --top-1: #157a6e;
      --top-2: #1b5299;
      --gold: #ffb300;
      --green: #26b89d;
      --danger: #e5484d;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: var(--header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .app-title {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-admin {
      background: rgba(255, 179, 0, 0.16);
      color: var(--gold);
      border: 1px solid rgba(255, 179, 0, 0.35);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .date-box {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      position: relative;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      flex-shrink: 0;
    }

    .date-box input[type="date"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px 14px 48px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      margin-top: 4px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    input,
    select,
    textarea {
      background: var(--bg);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--orange-1);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--orange-1), var(--orange-2));
      color: var(--text);
      flex: 1;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .btn-teal {
      background: linear-gradient(135deg, var(--teal-1), var(--teal-2));
      color: var(--text);
    }

    .btn-danger {
      background: rgba(229, 72, 77, 0.16);
      color: #ff8a8e;
      border: 1px solid rgba(229, 72, 77, 0.35);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
    }

    .chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip.active {
      background: rgba(255, 152, 0, 0.18);
      border-color: var(--orange-1);
      color: var(--text);
    }

    .tip-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .tip-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .section-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
    }

    .tip-match {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .tip-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .tip-pick {
      color: var(--green);
      font-weight: 700;
    }

    .tip-odds {
      background: #222d3d;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .status-select {
      width: auto;
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 8px;
    }

    .io-box {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    textarea.json-area {
      min-height: 150px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
    }

    .empty-state {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 20px 10px;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1f2b3b;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 520px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="app-title">Betting Solutions</div>
      <span class="badge-admin">Admin</span>
    </div>
    <label class="date-box" title="Select Date">
      <span>📅</span>
      <span id="dateLabel">2026 - Nov 24</span>
      <input id="dateInput" type="date" value="2026-11-24" />
    </label>
  </header>

  <main class="container">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Date Total</div>
        <div class="stat-value" id="statDateTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">VIP Tips</div>
        <div class="stat-value" id="statVipTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Won</div>
        <div class="stat-value" id="statWonTotal" style="color: var(--green);">0</div>
      </div>
    </div>

    <!-- ADD / EDIT MATCH FORM -->
    <section class="panel">
      <div class="panel-title">
        <span id="formTitle">Add New Selection</span>
        <span id="editingBadge" style="display:none; font-size:12px; color:var(--gold);">Editing</span>
      </div>
      <form id="matchForm">
        <input type="hidden" id="matchId" />
        <div class="form-grid">
          <div class="field">
            <label for="sectionInput">Section</label>
            <select id="sectionInput" required>
              <option value="Daily Free Tips">Daily Free Tips</option>
              <option value="Daily Surprise">Daily Surprise</option>
              <option value="Premium VIP Tips">Premium VIP Tips</option>
            </select>
          </div>
          <div class="field">
            <label for="matchDateInput">Date</label>
            <input id="matchDateInput" type="date" value="2026-11-24" required />
          </div>
          <div class="field">
            <label for="leagueInput">League / Competition</label>
            <input id="leagueInput" type="text" placeholder="e.g. Premier League" required />
          </div>
          <div class="field">
            <label for="timeInput">Kickoff Time</label>
            <input id="timeInput" type="time" value="19:30" required />
          </div>
          <div class="field full">
            <label for="matchInput">Match</label>
            <input id="matchInput" type="text" placeholder="e.g. Arsenal vs Chelsea" required />
          </div>
          <div class="field">
            <label for="pickInput">Tip / Pick</label>
            <input id="pickInput" type="text" placeholder="e.g. Over 1.5 Goals" required />
          </div>
          <div class="field">
            <label for="oddsInput">Odds</label>
            <input id="oddsInput" type="text" placeholder="e.g. 1.65" required />
          </div>
          <div class="field full">
            <label for="statusInput">Status</label>
            <select id="statusInput">
              <option value="Pending">Pending</option>
              <option value="Won">Won</option>
              <option value="Lost">Lost</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Save Selection</button>
          <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;">Cancel</button>
        </div>
      </form>
    </section>

    <!-- MATCH LIST FOR SELECTED DATE -->
    <section class="panel">
      <div class="panel-title">
        <span>Selections (<span id="listDateText">2026 - Nov 24</span>)</span>
      </div>
      <div class="filter-bar" id="filterBar">
        <button type="button" class="chip active" data-filter="All">All</button>
        <button type="button" class="chip" data-filter="Daily Free Tips">Daily Free Tips</button>
        <button type="button" class="chip" data-filter="Daily Surprise">Daily Surprise</button>
        <button type="button" class="chip" data-filter="Premium VIP Tips">Premium VIP Tips</button>
      </div>
      <div id="matchesList"></div>
    </section>

    <!-- EXPORT / IMPORT JSON FOR APP -->
    <section class="panel">
      <div class="panel-title">
        <span>Data Export / Import</span>
      </div>
      <div class="io-box">
        <button type="button" class="btn btn-teal btn-sm" id="copyArrayBtn">Copy ALL_MATCHES JS</button>
        <button type="button" class="btn btn-secondary btn-sm" id="exportJsonBtn">Export JSON</button>
        <button type="button" class="btn btn-secondary btn-sm" id="importJsonBtn">Load JSON from Box</button>
        <button type="button" class="btn btn-danger btn-sm" id="resetDefaultBtn">Reset Default</button>
      </div>
      <textarea id="jsonBox" class="json-area" spellcheck="false" placeholder="JSON or ALL_MATCHES array appears here..."></textarea>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const DEFAULT_MATCHES = [
      {
        "id": "p_1",
        "section": "Daily Free Tips",
        "date": "2026-11-24",
        "league": "Premier League",
        "time": "19:30",
        "match": "Arsenal vs Chelsea",
        "pick": "Over 1.5 Goals",
        "odds": "1.35",
        "status": "Pending"
      },
      {
        "id": "p_2",
        "section": "Daily Free Tips",
        "date": "2026-11-24",
        "league": "La Liga",
        "time": "21:00",
        "match": "Real Madrid vs Villarreal",
        "pick": "Home Win",
        "odds": "1.62",
        "status": "Won"
      },
      {
        "id": "p_3",
        "section": "Daily Surprise",
        "date": "2026-11-24",
        "league": "Serie A",
        "time": "20:45",
        "match": "Inter Milan vs Napoli",
        "pick": "BTTS - Yes & Over 2.5",
        "odds": "2.15",
        "status": "Pending"
      },
      {
        "id": "p_4",
        "section": "Premium VIP Tips",
        "date": "2026-11-24",
        "league": "UEFA Champions League",
        "time": "21:00",
        "match": "Bayern Munich vs PSG",
        "pick": "Home Win & BTTS",
        "odds": "3.10",
        "status": "Pending"
      },
      {
        "id": "p_5",
        "section": "Premium VIP Tips",
        "date": "2026-11-24",
        "league": "Bundesliga",
        "time": "18:30",
        "match": "Bayer Leverkusen vs RB Leipzig",
        "pick": "Correct Score 2-1",
        "odds": "8.50",
        "status": "Pending"
      }
    ];

    const STORAGE_KEY = "betting_solutions_matches_v1";

    function loadMatches() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [...DEFAULT_MATCHES];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [...DEFAULT_MATCHES];
      } catch {
        return [...DEFAULT_MATCHES];
      }
    }

    let matches = loadMatches();
    let activeFilter = "All";

    const dateInput = document.getElementById("dateInput");
    const dateLabel = document.getElementById("dateLabel");
    const listDateText = document.getElementById("listDateText");
    const matchDateInput = document.getElementById("matchDateInput");
    const matchForm = document.getElementById("matchForm");
    const matchIdInput = document.getElementById("matchId");
    const sectionInput = document.getElementById("sectionInput");
    const leagueInput = document.getElementById("leagueInput");
    const timeInput = document.getElementById("timeInput");
    const matchInput = document.getElementById("matchInput");
    const pickInput = document.getElementById("pickInput");
    const oddsInput = document.getElementById("oddsInput");
    const statusInput = document.getElementById("statusInput");
    const formTitle = document.getElementById("formTitle");
    const submitBtn = document.getElementById("submitBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const editingBadge = document.getElementById("editingBadge");
    const matchesList = document.getElementById("matchesList");
    const filterBar = document.getElementById("filterBar");
    const jsonBox = document.getElementById("jsonBox");
    const toast = document.getElementById("toast");

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function formatDisplayDate(isoStr) {
      const [y, m, d] = isoStr.split("-").map(Number);
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const monthName = months[(m || 1) - 1] || "Nov";
      const dayStr = String(d || 1).padStart(2, "0");
      return `${y} - ${monthName} ${dayStr}`;
    }

    function saveMatches() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(matches));
      render();
    }

    function nextId() {
      const nums = matches
        .map(m => parseInt(String(m.id || "").replace(/\D+/g, ""), 10))
        .filter(n => !Number.isNaN(n));
      const maxNum = nums.length ? Math.max(...nums) : 0;
      return `p_${maxNum + 1}`;
    }

    function resetForm() {
      matchIdInput.value = "";
      sectionInput.value = "Daily Free Tips";
      matchDateInput.value = dateInput.value || "2026-11-24";
      leagueInput.value = "";
      timeInput.value = "19:30";
      matchInput.value = "";
      pickInput.value = "";
      oddsInput.value = "";
      statusInput.value = "Pending";
      formTitle.textContent = "Add New Selection";
      submitBtn.textContent = "Save Selection";
      cancelEditBtn.style.display = "none";
      editingBadge.style.display = "none";
    }

    function startEdit(id) {
      const item = matches.find(m => m.id === id);
      if (!item) return;
      matchIdInput.value = item.id;
      sectionInput.value = item.section;
      matchDateInput.value = item.date;
      leagueInput.value = item.league;
      timeInput.value = item.time;
      matchInput.value = item.match;
      pickInput.value = item.pick;
      oddsInput.value = item.odds;
      statusInput.value = item.status || "Pending";
      formTitle.textContent = `Edit Selection (${item.id})`;
      submitBtn.textContent = "Update Selection";
      cancelEditBtn.style.display = "inline-flex";
      editingBadge.style.display = "inline";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function deleteMatch(id) {
      matches = matches.filter(m => m.id !== id);
      if (matchIdInput.value === id) resetForm();
      saveMatches();
      showToast("Selection deleted");
    }

    function updateStatus(id, newStatus) {
      const item = matches.find(m => m.id === id);
      if (!item) return;
      item.status = newStatus;
      saveMatches();
      showToast(`Status set to ${newStatus}`);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function render() {
      const activeDate = dateInput.value || "2026-11-24";
      const formattedDate = formatDisplayDate(activeDate);
      dateLabel.textContent = formattedDate;
      listDateText.textContent = formattedDate;

      const dateMatches = matches.filter(m => m.date === activeDate);
      document.getElementById("statDateTotal").textContent = dateMatches.length;
      document.getElementById("statVipTotal").textContent = dateMatches.filter(m => m.section === "Premium VIP Tips").length;
      document.getElementById("statWonTotal").textContent = dateMatches.filter(m => m.status === "Won").length;

      const visible = dateMatches.filter(m => activeFilter === "All" || m.section === activeFilter);

      if (!visible.length) {
        matchesList.innerHTML = `<div class="empty-state">No selections for ${escapeHtml(formattedDate)}${activeFilter !== "All" ? ` in ${escapeHtml(activeFilter)}` : ""}.</div>`;
        return;
      }

      matchesList.innerHTML = visible.map(item => `
        <div class="tip-item">
          <div class="tip-meta">
            <span>${escapeHtml(item.league)} · ${escapeHtml(item.time)}</span>
            <span class="section-tag">${escapeHtml(item.section)}</span>
          </div>
          <div class="tip-match">${escapeHtml(item.match)}</div>
          <div class="tip-bottom">
            <span class="tip-pick">Tip: ${escapeHtml(item.pick)}</span>
            <span class="tip-odds">@ ${escapeHtml(item.odds)}</span>
          </div>
          <div class="item-actions">
            <select class="status-select" aria-label="Status" onchange="updateStatus('${item.id}', this.value)">
              <option value="Pending" ${item.status === "Pending" ? "selected" : ""}>Pending</option>
              <option value="Won" ${item.status === "Won" ? "selected" : ""}>Won</option>
              <option value="Lost" ${item.status === "Lost" ? "selected" : ""}>Lost</option>
            </select>
            <button type="button" class="btn btn-secondary btn-sm" onclick="startEdit('${item.id}')">Edit</button>
            <button type="button" class="btn btn-danger btn-sm" onclick="deleteMatch('${item.id}')">Delete</button>
          </div>
        </div>
      `).join("");
    }

    matchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const existingId = matchIdInput.value;
      const entry = {
        id: existingId || nextId(),
        section: sectionInput.value,
        date: matchDateInput.value,
        league: leagueInput.value.trim(),
        time: timeInput.value,
        match: matchInput.value.trim(),
        pick: pickInput.value.trim(),
        odds: oddsInput.value.trim(),
        status: statusInput.value
      };

      if (existingId) {
        matches = matches.map(m => (m.id === existingId ? entry : m));
        showToast("Selection updated");
      } else {
        matches.push(entry);
        showToast("Selection added");
      }

      if (entry.date && entry.date !== dateInput.value) {
        dateInput.value = entry.date;
      }

      resetForm();
      saveMatches();
    });

    cancelEditBtn.addEventListener("click", resetForm);

    dateInput.addEventListener("change", () => {
      if (!matchIdInput.value) {
        matchDateInput.value = dateInput.value;
      }
      render();
    });

    filterBar.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      activeFilter = chip.dataset.filter;
      filterBar.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === chip));
      render();
    });

    document.getElementById("exportJsonBtn").addEventListener("click", () => {
      jsonBox.value = JSON.stringify(matches, null, 2);
      showToast("Exported JSON");
    });

    document.getElementById("copyArrayBtn").addEventListener("click", async () => {
      const code = `const ALL_MATCHES = ${JSON.stringify(matches, null, 2)};`;
      jsonBox.value = code;
      try {
        await navigator.clipboard.writeText(code);
        showToast("Copied ALL_MATCHES to clipboard");
      } catch {
        jsonBox.select();
        document.execCommand("copy");
        showToast("Copied ALL_MATCHES");
      }
    });

    document.getElementById("importJsonBtn").addEventListener("click", () => {
      let raw = jsonBox.value.trim();
      if (!raw) {
        showToast("Paste JSON first");
        return;
      }
      raw = raw.replace(/^const\s+ALL_MATCHES\s*=\s*/, "").replace(/;\s*$/, "");
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) throw new Error("Must be an array");
        matches = parsed;
        saveMatches();
        showToast("Imported selections");
      } catch {
        showToast("Invalid JSON array");
      }
    });

    document.getElementById("resetDefaultBtn").addEventListener("click", () => {
      matches = [...DEFAULT_MATCHES];
      resetForm();
      saveMatches();
      showToast("Reset to default selections");
    });

    render();
  </script>
</body>
</html>
